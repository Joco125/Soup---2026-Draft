<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Soup 2026 Fantasy Auction Draft</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
box-sizing:border-box;
}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
}

body{
background:#0b1020;
color:#fff;
font-family:Arial,sans-serif;
}

header{
height:82px;
padding:16px 30px;
background:#11182b;
border-bottom:1px solid #293553;
display:flex;
justify-content:space-between;
align-items:center;
}

h1{
margin:0;
font-size:25px;
}

.container{
width:100%;
height:calc(100vh - 82px);
padding:18px;
}

.layout{
display:grid;
grid-template-columns:2fr 1fr;
gap:18px;
height:100%;
}

.left-column,
.right-column{
min-height:0;
display:flex;
flex-direction:column;
}

.card{
background:#11182b;
border:1px solid #293553;
border-radius:14px;
padding:18px;
margin-bottom:18px;
}

.auction{
text-align:center;
padding:30px 20px;
flex-shrink:0;
}

.label{
color:#9da9c0;
font-size:13px;
font-weight:bold;
letter-spacing:1px;
}

.player{
font-size:40px;
font-weight:bold;
margin-top:12px;
}

.position{
color:#4f8cff;
font-size:20px;
font-weight:bold;
margin-top:5px;
}

.sold{
color:#32c875;
font-size:20px;
font-weight:bold;
margin-top:18px;
}

input,select{
width:100%;
background:#0b1020;
color:#fff;
border:1px solid #293553;
border-radius:8px;
padding:11px;
font-size:14px;
}

button{
border:0;
border-radius:8px;
padding:10px 15px;
font-weight:bold;
cursor:pointer;
}

.green{
background:#32c875;
color:white;
}

.gray{
background:#26324d;
color:white;
}

.red{
background:#ef5350;
color:white;
}

.blue{
background:#4f8cff;
color:white;
}

.controls{
display:grid;
grid-template-columns:1fr 150px 120px;
gap:10px;
}

.player-list{
max-height:240px;
overflow:auto;
margin-top:10px;
}

.player-row{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px;
border-bottom:1px solid #293553;
gap:10px;
}

.player-info{
display:flex;
flex-direction:column;
gap:3px;
}

.player-name{
font-weight:bold;
}

.player-team{
color:#9da9c0;
font-size:12px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:9px 10px;
text-align:left;
border-bottom:1px solid #293553;
}

th{
color:#9da9c0;
font-size:12px;
}

.money{
font-weight:bold;
}

.small{
color:#9da9c0;
font-size:12px;
}

.status{
padding:8px 12px;
border-radius:20px;
background:#26324d;
color:#9da9c0;
font-size:13px;
}

.online{
color:#32c875;
}

.error{
color:#ef5350;
}

#commissioner{
display:none;
}

#loginBox{
display:none;
}

#commissionerMenu{
position:relative;
display:inline-block;
}

#commissionerButton{
background:#26324d;
color:white;
}

#commissionerPanel{
display:none;
position:absolute;
right:0;
top:46px;
width:340px;
z-index:100;
}

#commissionerPanel.open{
display:block;
}

#commissionerPanel .card{
margin:0;
box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.history-card{
flex:1;
min-height:0;
overflow:hidden;
}

.history-table{
height:calc(100% - 42px);
overflow:auto;
}

.history-table table{
width:100%;
}

.history-table th{
position:sticky;
top:0;
background:#11182b;
}

.team-card{
height:100%;
margin-bottom:0;
display:flex;
flex-direction:column;
}

.team-card h2{
font-size:24px;
margin-top:0;
}

.team-table{
flex:1;
display:flex;
flex-direction:column;
justify-content:center;
}

.team-table table{
width:100%;
}

.team-table th{
font-size:17px;
padding:15px 12px;
}

.team-table td{
font-size:25px;
font-weight:bold;
padding:18px 12px;
}

.team-table td:first-child{
font-size:24px;
}

.team-table .money{
font-size:28px;
}

.recent-title{
margin-top:0;
}

@media(max-width:900px){

html,body{
overflow:auto;
}

header{
height:auto;
}

.container{
height:auto;
}

.layout{
grid-template-columns:1fr;
height:auto;
}

.team-card{
height:auto;
}

.controls{
grid-template-columns:1fr;
}

.player{
font-size:32px;
}

#commissionerPanel{
position:fixed;
right:15px;
top:70px;
width:min(340px,calc(100vw - 30px));
}

}
</style>
</head>

<body>

<header>

<div>
<h1>🏈 Soup 2026 Fantasy Auction Draft</h1>

<div class="small">
10 Teams • $200 Budget • 15 Players
</div>
</div>

<div style="display:flex;align-items:center;gap:10px;">

<span id="connection" class="status">
Connecting...
</span>

<div id="commissionerMenu">

<button
id="commissionerButton"
>
Commissioner
</button>

<div id="commissionerPanel">

<div class="card">

<h2 style="margin-top:0;">
Commissioner Controls
</h2>

<input
id="pinInput"
type="password"
placeholder="Commissioner PIN"
>

<br><br>

<button
id="loginButton"
class="blue"
style="width:100%;"
>
Enter Commissioner Mode
</button>

<p
id="loginMessage"
class="small"
></p>

<div id="commissionerControls" style="display:none;">

<hr style="border:0;border-top:1px solid #293553;margin:18px 0;">

<input
id="search"
placeholder="Search player..."
>

<div
id="playerList"
class="player-list"
></div>

<br>

<div class="controls">

<select id="winningTeam"></select>

<input
id="winningBid"
type="number"
min="1"
placeholder="Winning bid"
>

<button
id="sellButton"
class="green"
>
SELL
</button>

</div>

<br>

<button
id="unnominateButton"
class="gray"
style="width:100%;"
>
Un-Nominate
</button>

<br><br>

<button
id="undoButton"
class="gray"
>
Undo Last Sale
</button>

<button
id="resetButton"
class="red"
>
Reset Draft
</button>

<br><br>

<button
id="logoutButton"
class="gray"
style="width:100%;"
>
Exit Commissioner Mode
</button>

</div>

</div>

</div>

</div>

</header>


<div class="container">

<div class="layout">


<!-- LEFT SIDE -->

<div class="left-column">


<!-- ACTIVE AUCTION -->

<div class="card auction">

<div class="label">
ACTIVE AUCTION
</div>

<div id="playerName" class="player">
No Player Nominated
</div>

<div id="playerPosition" class="position">
—
</div>

<div id="soldMessage"></div>

</div>


<!-- RECENT DRAFTED PLAYERS -->

<div class="card history-card">

<h2 class="recent-title">
Recent Drafted Players
</h2>

<div class="history-table">

<table>

<thead>

<tr>
<th>#</th>
<th>Player</th>
<th>Pos</th>
<th>Team</th>
<th>Price</th>
</tr>

</thead>

<tbody id="history"></tbody>

</table>

</div>

</div>

</div>


<!-- RIGHT SIDE -->

<div class="right-column">

<div class="card team-card">

<h2>
Team Status
</h2>

<div class="team-table">

<table>

<thead>

<tr>
<th>Team</th>
<th>$ Left</th>
<th>Max Bid</th>
</tr>

</thead>

<tbody id="teams"></tbody>

</table>

</div>

</div>

</div>


</div>

</div>


<script>

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
"https://hbwszhzcbmlqidkppzoe.supabase.co";

const SUPABASE_KEY =
"sb_publishable_JT3NCra2viuuGm3jJFCF-g_pc_1X3VK";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================================================
   COMMISSIONER PIN
   ========================================================= */

const COMMISSIONER_PIN =
"0125";

let isCommissioner =
false;


/* =========================================================
   TEAMS
   ========================================================= */

const teams = [

"Joco",
"Bij",
"Steguin",
"Mike Gabbay",
"Allie + Ikey",
"Jack + Ike B",
"Ben",
"Dave",
"Jeff",
"Lati"

];


/* =========================================================
   PLAYERS
   ========================================================= */

const players = [

["Josh Allen","BUF","QB"],
["Lamar Jackson","BAL","QB"],
["Jalen Hurts","PHI","QB"],
["Joe Burrow","CIN","QB"],
["Patrick Mahomes II","KC","QB"],

["Bijan Robinson","ATL","RB"],
["Saquon Barkley","PHI","RB"],
["Jahmyr Gibbs","DET","RB"],
["Christian McCaffrey","SF","RB"],
["Jonathan Taylor","IND","RB"],

["CeeDee Lamb","DAL","WR"],
["Ja'Marr Chase","CIN","WR"],
["Justin Jefferson","MIN","WR"],
["Amon-Ra St. Brown","DET","WR"],
["Puka Nacua","LAR","WR"],
["Tyreek Hill","MIA","WR"],
["A.J. Brown","PHI","WR"],
["Malik Nabers","NYG","WR"],
["Garrett Wilson","NYJ","WR"],
["Nico Collins","HOU","WR"],

["Brock Bowers","LV","TE"],
["Trey McBride","ARI","TE"],
["Sam LaPorta","DET","TE"],
["Travis Kelce","KC","TE"],
["George Kittle","SF","TE"],

["Brandon Aubrey","DAL","K"],
["Justin Tucker","BAL","K"],
["Harrison Butker","KC","K"],

["Baltimore Ravens","BAL","DEF"],
["San Francisco 49ers","SF","DEF"],
["Pittsburgh Steelers","PIT","DEF"],
["Kansas City Chiefs","KC","DEF"]

];


/* =========================================================
   STATE
   ========================================================= */

function emptyState(){

const rosters = {};

teams.forEach(team=>{
rosters[team]=[];
});

return {

rosters:rosters,
history:[],
active:null

};

}

let state =
emptyState();


/* =========================================================
   NORMALIZE STATE
   ========================================================= */

function normalizeState(saved){

const clean =
emptyState();


if(saved && saved.rosters){

teams.forEach(team=>{

if(Array.isArray(
saved.rosters[team]
)){

clean.rosters[team] =
saved.rosters[team];

}

});

}


if(saved &&
Array.isArray(saved.history)){

clean.history =
saved.history;

}


if(saved &&
saved.active){

clean.active =
saved.active;

}


return clean;

}


/* =========================================================
   CONNECTION
   ========================================================= */

function setConnection(
text,
isError
){

const element =
document.getElementById(
"connection"
);

element.textContent =
text;

element.classList.remove(
"online"
);

element.classList.remove(
"error"
);

if(isError){

element.classList.add(
"error"
);

}else if(text==="LIVE"){

element.classList.add(
"online"
);

}

}


/* =========================================================
   LOAD DRAFT
   ========================================================= */

async function loadDraft(){

const {data,error} =

await supabaseClient

.from("draft_state")

.select("state")

.eq(
"draft_code",
"JCO26"
)

.limit(1);


if(error){

console.error(
"LOAD ERROR:",
error
);

setConnection(
"DATABASE ERROR",
true
);

return;

}


if(data &&
data.length &&
data[0].state){

state =
normalizeState(
data[0].state
);

}else{

state =
emptyState();

}


setConnection(
"LIVE",
false
);

render();

}


/* =========================================================
   SAVE
   ========================================================= */

async function saveDraft(){

const {error} =

await supabaseClient

.from("draft_state")

.update({

state:state,

updated_at:
new Date().toISOString()

})

.eq(
"id",
1
);


if(error){

console.error(
"SAVE ERROR:",
error
);

alert(
"Could not save draft."
);

}

}


/* =========================================================
   LIVE UPDATES
   ========================================================= */

async function checkForUpdates(){

const {data,error} =

await supabaseClient

.from("draft_state")

.select(
"state,updated_at"
)

.eq(
"draft_code",
"JCO26"
)

.limit(1);


if(error){

console.error(
"UPDATE ERROR:",
error
);

setConnection(
"DATABASE ERROR",
true
);

return;

}


setConnection(
"LIVE",
false
);


if(data &&
data.length &&
data[0].state){

state =
normalizeState(
data[0].state
);

render();

}

}


setInterval(
checkForUpdates,
2000
);


/* =========================================================
   COMMISSIONER MENU
   ========================================================= */

document
.getElementById(
"commissionerButton"
)
.addEventListener(
"click",
function(){

const panel =
document.getElementById(
"commissionerPanel"
);

panel.classList.toggle(
"open"
);

}
);


/* =========================================================
   LOGIN
   ========================================================= */

function login(){

const entered =
document.getElementById(
"pinInput"
).value;


if(entered ===
COMMISSIONER_PIN){

isCommissioner =
true;

document.getElementById(
"loginButton"
).style.display =
"none";

document.getElementById(
"pinInput"
).style.display =
"none";

document.getElementById(
"commissionerControls"
).style.display =
"block";

document.getElementById(
"loginMessage"
).textContent =
"Commissioner mode active.";

loadTeams();

searchPlayers();

}else{

document.getElementById(
"loginMessage"
).textContent =
"Incorrect PIN.";

}

}


/* =========================================================
   LOGOUT
   ========================================================= */

function logout(){

isCommissioner =
false;

document.getElementById(
"loginButton"
).style.display =
"block";

document.getElementById(
"pinInput"
).style.display =
"block";

document.getElementById(
"commissionerControls"
).style.display =
"none";

document.getElementById(
"pinInput"
).value="";

document.getElementById(
"loginMessage"
).textContent="";

}


/* =========================================================
   TEAMS
   ========================================================= */

function loadTeams(){

const dropdown =
document.getElementById(
"winningTeam"
);

dropdown.innerHTML="";


teams.forEach(team=>{

const option =
document.createElement(
"option"
);

option.value =
team;

option.textContent =
team;

dropdown.appendChild(
option
);

});

}


/* =========================================================
   SEARCH PLAYERS
   ========================================================= */

function searchPlayers(){

if(!isCommissioner){

return;

}


const query =

document.getElementById(
"search"
).value
.toLowerCase()
.trim();


const list =
document.getElementById(
"playerList"
);

list.innerHTML="";


/*
Only show players after the
commissioner actually searches.
*/

if(!query){

return;

}


const soldNames =
new Set(
state.history.map(
x=>x.name
)
);


players

.filter(player=>

player[0]
.toLowerCase()
.includes(query)

)

.filter(player=>

!soldNames.has(
player[0]
)

)

.forEach(player=>{

const row =
document.createElement(
"div"
);

row.className =
"player-row";


const info =
document.createElement(
"div"
);

info.className =
"player-info";


const name =
document.createElement(
"div"
);

name.className =
"player-name";

name.textContent =
player[0];


const team =
document.createElement(
"div"
);

team.className =
"player-team";

team.textContent =
player[1] +
" • " +
player[2];


info.appendChild(name);
info.appendChild(team);


const button =
document.createElement(
"button"
);

button.className =
"gray";

button.textContent =
"Nominate";


button.onclick =
function(){

nominate(
player[0],
player[1],
player[2]
);

};


row.appendChild(info);

row.appendChild(button);

list.appendChild(row);

});

}


/* =========================================================
   NOMINATE
   ========================================================= */

async function nominate(
name,
team,
position
){

if(!isCommissioner){

return;

}


state.active={

name:name,

team:team,

position:position,

sold:false

};


/*
Clear search bar after nomination.
*/

document.getElementById(
"search"
).value="";


document.getElementById(
"playerList"
).innerHTML="";


render();

await saveDraft();

}


/* =========================================================
   UN-NOMINATE
   ========================================================= */

async function unnominate(){

if(!isCommissioner){

return;

}


if(!state.active){

return;

}


if(state.active.sold){

alert(
"This player has already been sold."
);

return;

}


state.active =
null;


render();

await saveDraft();

}


/* =========================================================
   SELL
   ========================================================= */

async function sellPlayer(){

if(!isCommissioner){

return;

}


if(!state.active){

alert(
"Nominate a player first."
);

return;

}


const team =

document.getElementById(
"winningTeam"
).value;


const bid =

Number(
document.getElementById(
"winningBid"
).value
);


if(!bid || bid<1){

alert(
"Enter a winning bid."
);

return;

}


const roster =
state.rosters[team];


const spent =

roster.reduce(
(sum,player)=>
sum+Number(player.price),
0
);


const remaining =
200-spent;


const spotsLeft =
15-roster.length;


const maxBid =
remaining-(spotsLeft-1);


if(bid>maxBid){

alert(
team+
" can only bid up to $"+
maxBid
);

return;

}


const purchase={

name:
state.active.name,

position:
state.active.position,

nflTeam:
state.active.team,

team:team,

price:bid

};


state.rosters[team]
.push(purchase);


state.history
.push(purchase);


state.active={

...purchase,

sold:true

};


document.getElementById(
"winningBid"
).value="";

document.getElementById(
"search"
).value="";

document.getElementById(
"playerList"
).innerHTML="";


render();

await saveDraft();

}


/* =========================================================
   UNDO
   ========================================================= */

async function undoLast(){

if(!isCommissioner){

return;

}


if(!state.history.length){

return;

}


const last =
state.history.pop();


const roster =
state.rosters[last.team];


const index =

roster.findIndex(
player=>

player.name===
last.name &&

Number(player.price)===
Number(last.price)

);


if(index>=0){

roster.splice(
index,
1
);

}


state.active =
null;


render();

await saveDraft();

}


/* =========================================================
   RESET
   ========================================================= */

async function resetDraft(){

if(!isCommissioner){

return;

}


const answer =
confirm(
"RESET THE ENTIRE DRAFT?"
);


if(!answer){

return;

}


state =
emptyState();

render();

await saveDraft();

}


/* =========================================================
   TEAM STATUS
   ========================================================= */

function renderTeams(){

const table =
document.getElementById(
"teams"
);

table.innerHTML="";


teams.forEach(team=>{

const roster =
state.rosters[team] ||
[];


const spent =

roster.reduce(
(sum,player)=>
sum+Number(player.price),
0
);


const remaining =
200-spent;


const spots =
15-roster.length;


const maxBid =

Math.max(
0,
remaining-(spots-1)
);


const row =
document.createElement(
"tr"
);


row.innerHTML = `

<td>
<b>${team}</b>
</td>

<td class="money">
$${remaining}
</td>

<td class="money">
$${maxBid}
</td>

`;


table.appendChild(row);

});

}


/* =========================================================
   HISTORY
   ========================================================= */

function renderHistory(){

const table =
document.getElementById(
"history"
);

table.innerHTML="";


/*
Most recent player first.
*/

const recent =
[...state.history]
.reverse();


recent.forEach(
(player,index)=>{

const row =
document.createElement(
"tr"
);


row.innerHTML = `

<td>
${state.history.length-index}
</td>

<td>
<b>${player.name}</b>
</td>

<td>
${player.position}
</td>

<td>
${player.team}
</td>

<td class="money">
$${player.price}
</td>

`;


table.appendChild(row);

});

}


/* =========================================================
   ACTIVE PLAYER
   ========================================================= */

function renderActive(){

const name =
document.getElementById(
"playerName"
);

const position =
document.getElementById(
"playerPosition"
);

const sold =
document.getElementById(
"soldMessage"
);


if(!state.active){

name.textContent =
"No Player Nominated";

position.textContent =
"—";

sold.innerHTML =
"";

return;

}


name.textContent =
state.active.name;

position.textContent =
state.active.position;


if(state.active.sold){

sold.innerHTML = `

<div class="sold">

SOLD — ${state.active.team}
— $${state.active.price}

</div>

`;

}else{

sold.innerHTML="";

}

}


/* =========================================================
   RENDER
   ========================================================= */

function render(){

renderActive();

renderTeams();

renderHistory();

if(isCommissioner){

searchPlayers();

}

}


/* =========================================================
   BUTTONS
   ========================================================= */

document
.getElementById(
"loginButton"
)
.addEventListener(
"click",
login
);


document
.getElementById(
"pinInput"
)
.addEventListener(
"keydown",
function(event){

if(event.key==="Enter"){

login();

}

});


document
.getElementById(
"logoutButton"
)
.addEventListener(
"click",
logout
);


document
.getElementById(
"search"
)
.addEventListener(
"input",
searchPlayers
);


document
.getElementById(
"sellButton"
)
.addEventListener(
"click",
sellPlayer
);


document
.getElementById(
"unnominateButton"
)
.addEventListener(
"click",
unnominate
);


document
.getElementById(
"undoButton"
)
.addEventListener(
"click",
undoLast
);


document
.getElementById(
"resetButton"
)
.addEventListener(
"click",
resetDraft
);


/* =========================================================
   START
   ========================================================= */

loadTeams();

render();

loadDraft();

</script>

</body>
</html>
