<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soup 2026 Fantasy Auction Draft</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#0b1020;
  color:#fff;
  font-family:Arial,sans-serif
}

header{
  padding:20px 30px;
  background:#11182b;
  border-bottom:1px solid #293553;
  display:flex;
  justify-content:space-between;
  align-items:center
}

h1{
  margin:0;
  font-size:25px
}

.container{
  max-width:1500px;
  margin:auto;
  padding:20px
}

.layout{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:20px
}

.card{
  background:#11182b;
  border:1px solid #293553;
  border-radius:14px;
  padding:20px;
  margin-bottom:20px
}

.auction{
  text-align:center;
  padding:45px 20px
}

.label{
  color:#9da9c0;
  font-size:13px;
  font-weight:bold;
  letter-spacing:1px
}

.player{
  font-size:42px;
  font-weight:bold;
  margin-top:15px
}

.position{
  color:#4f8cff;
  font-size:20px;
  font-weight:bold;
  margin-top:5px
}

.sold{
  color:#32c875;
  font-size:20px;
  font-weight:bold;
  margin-top:20px
}

input,select{
  width:100%;
  background:#0b1020;
  color:#fff;
  border:1px solid #293553;
  border-radius:8px;
  padding:11px
}

button{
  border:0;
  border-radius:8px;
  padding:10px 15px;
  font-weight:bold;
  cursor:pointer
}

.green{
  background:#32c875;
  color:white
}

.gray{
  background:#26324d;
  color:white
}

.red{
  background:#ef5350;
  color:white
}

.controls{
  display:grid;
  grid-template-columns:1fr 150px 120px;
  gap:10px
}

.player-list{
  max-height:300px;
  overflow:auto;
  margin-top:10px
}

.player-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
  border-bottom:1px solid #293553
}

table{
  width:100%;
  border-collapse:collapse
}

th,td{
  padding:10px;
  text-align:left;
  border-bottom:1px solid #293553
}

th{
  color:#9da9c0;
  font-size:12px
}

.money{
  font-weight:bold
}

.small{
  color:#9da9c0;
  font-size:12px
}

.status{
  padding:8px 12px;
  border-radius:20px;
  background:#26324d;
  color:#9da9c0;
  font-size:13px
}

.online{
  color:#32c875
}

.error{
  color:#ef5350
}

@media(max-width:900px){
  .layout{
    grid-template-columns:1fr
  }

  .controls{
    grid-template-columns:1fr
  }

  .player{
    font-size:32px
  }
}
</style>
</head>

<body>

<header>

<div>
<h1>🏈 Soup 2026 Fantasy Auction Draft</h1>

<div class="small">
10 Teams • $200 Budget • 15 Players
</div>
</div>

<div>
<span id="connection" class="status">
Connecting...
</span>
</div>

</header>


<div class="container">

<div class="layout">

<div>

<!-- ACTIVE AUCTION -->

<div class="card auction">

<div class="label">
ACTIVE AUCTION
</div>

<div id="playerName" class="player">
No Player Nominated
</div>

<div id="playerPosition" class="position">
—
</div>

<div id="soldMessage"></div>

</div>


<!-- COMMISSIONER -->

<div class="card">

<h2>Commissioner Controls</h2>

<input
id="search"
placeholder="Search player..."
>

<div id="playerList" class="player-list"></div>

<br>

<div class="controls">

<select id="winningTeam"></select>

<input
id="winningBid"
type="number"
min="1"
placeholder="Winning bid"
>

<button
id="sellButton"
class="green"
>
SELL
</button>

</div>

<br>

<button
id="undoButton"
class="gray"
>
Undo Last Sale
</button>

<button
id="resetButton"
class="red"
>
Reset Draft
</button>

</div>


<!-- HISTORY -->

<div class="card">

<h2>Draft History</h2>

<table>

<thead>

<tr>
<th>#</th>
<th>Player</th>
<th>Pos</th>
<th>Team</th>
<th>Price</th>
</tr>

</thead>

<tbody id="history"></tbody>

</table>

</div>

</div>


<!-- TEAM STATUS -->

<div>

<div class="card">

<h2>Team Status</h2>

<table>

<thead>

<tr>
<th>Team</th>
<th>$ Left</th>
<th>Players</th>
<th>Max Bid</th>
</tr>

</thead>

<tbody id="teams"></tbody>

</table>

</div>

</div>

</div>

</div>


<script>

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
"https://hbwszhzcbmlqidkppzoe.supabase.co";

const SUPABASE_KEY =
"sb_publishable_JT3NCra2viuuGm3jJFCF-g_pc_1X3VK";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================================
   TEAMS
   ========================================================= */

const teams = [
  "Joco",
  "Bij",
  "Steguin",
  "Mike Gabbay",
  "Allie + Ikey",
  "Jack + Ike B",
  "Ben",
  "Dave",
  "Jeff",
  "Lati"
];


/* =========================================================
   PLAYERS
   ========================================================= */

const players = [

["Josh Allen","QB"],
["Lamar Jackson","QB"],
["Jalen Hurts","QB"],
["Joe Burrow","QB"],
["Patrick Mahomes","QB"],

["Bijan Robinson","RB"],
["Saquon Barkley","RB"],
["Jahmyr Gibbs","RB"],
["Christian McCaffrey","RB"],
["Jonathan Taylor","RB"],

["CeeDee Lamb","WR"],
["Ja'Marr Chase","WR"],
["Justin Jefferson","WR"],
["Amon-Ra St. Brown","WR"],
["Puka Nacua","WR"],
["Tyreek Hill","WR"],
["A.J. Brown","WR"],
["Malik Nabers","WR"],
["Garrett Wilson","WR"],
["Nico Collins","WR"],

["Brock Bowers","TE"],
["Trey McBride","TE"],
["Sam LaPorta","TE"],
["Travis Kelce","TE"],
["George Kittle","TE"],

["Brandon Aubrey","K"],
["Justin Tucker","K"],
["Harrison Butker","K"],

["Baltimore Ravens","DEF"],
["San Francisco 49ers","DEF"],
["Pittsburgh Steelers","DEF"],
["Kansas City Chiefs","DEF"]

];


/* =========================================================
   STATE
   ========================================================= */

function emptyState(){

const rosters = {};

teams.forEach(team=>{
  rosters[team] = [];
});

return {
  rosters:rosters,
  history:[],
  active:null
};

}

let state = emptyState();


/* =========================================================
   NORMALIZE STATE
   ========================================================= */

function normalizeState(saved){

const clean = emptyState();

if(saved && saved.rosters){

teams.forEach(team=>{

if(Array.isArray(saved.rosters[team])){

clean.rosters[team] =
saved.rosters[team];

}

});

}

if(saved && Array.isArray(saved.history)){

clean.history =
saved.history;

}

if(saved && saved.active){

clean.active =
saved.active;

}

return clean;

}


/* =========================================================
   DATABASE LOAD
   ========================================================= */

async function loadDraft(){

const {data,error} =

await supabaseClient
.from("draft_state")
.select("state")
.eq("draft_code","JCO26")
.limit(1);

if(error){

console.error("LOAD ERROR:",error);

setConnection("DATABASE ERROR",true);

return;

}

if(data && data.length && data[0].state){

state =
normalizeState(data[0].state);

}else{

state =
emptyState();

}

setConnection("LIVE",false);

render();

}


/* =========================================================
   DATABASE SAVE
   ========================================================= */

async function saveDraft(){

const {error} =

await supabaseClient
.from("draft_state")
.update({
  state:state,
  updated_at:new Date().toISOString()
})
.eq("id",1);

if(error){

console.error("SAVE ERROR:",error);

alert(
"Could not save draft. Check the browser console."
);

}

}


/* =========================================================
   DATABASE POLLING
   ========================================================= */

async function checkForUpdates(){

const {data,error} =

await supabaseClient
.from("draft_state")
.select("state,updated_at")
.eq("draft_code","JCO26")
.limit(1);

if(error){

console.error("UPDATE ERROR:",error);

setConnection("DATABASE ERROR",true);

return;

}

setConnection("LIVE",false);

if(data && data.length && data[0].state){

const incoming =
normalizeState(data[0].state);

state =
incoming;

render();

}

}

setInterval(
checkForUpdates,
2000
);


/* =========================================================
   CONNECTION DISPLAY
   ========================================================= */

function setConnection(text,isError){

const element =
document.getElementById("connection");

element.textContent =
text;

element.classList.remove("online");
element.classList.remove("error");

if(isError){

element.classList.add("error");

}else if(text==="LIVE"){

element.classList.add("online");

}

}


/* =========================================================
   TEAM DROPDOWN
   ========================================================= */

function loadTeams(){

const dropdown =
document.getElementById("winningTeam");

dropdown.innerHTML="";

teams.forEach(team=>{

const option =
document.createElement("option");

option.value =
team;

option.textContent =
team;

dropdown.appendChild(option);

});

}


/* =========================================================
   SEARCH
   ========================================================= */

function searchPlayers(){

const input =
document.getElementById("search");

const query =
input.value.toLowerCase().trim();

const list =
document.getElementById("playerList");

list.innerHTML="";

const soldNames =
new Set(
state.history.map(x=>x.name)
);

players

.filter(player=>{

return player[0]
.toLowerCase()
.includes(query);

})

.filter(player=>{

return !soldNames.has(player[0]);

})

.forEach(player=>{

const row =
document.createElement("div");

row.className =
"player-row";


const info =
document.createElement("span");

info.innerHTML =
`<b>${player[0]}</b>
<span class="small">${player[1]}</span>`;


const button =
document.createElement("button");

button.className =
"gray";

button.textContent =
"Nominate";


button.onclick = function(){

nominate(
player[0],
player[1]
);

};


row.appendChild(info);
row.appendChild(button);

list.appendChild(row);

});

}


/* =========================================================
   NOMINATE
   ========================================================= */

async function nominate(name,position){

state.active = {

name:name,
position:position,
sold:false

};

render();

await saveDraft();

}


/* =========================================================
   SELL
   ========================================================= */

async function sellPlayer(){

if(!state.active){

alert(
"Nominate a player first."
);

return;

}

const team =
document.getElementById(
"winningTeam"
).value;

const bid =
Number(
document.getElementById(
"winningBid"
).value
);

if(!bid || bid<1){

alert(
"Enter a winning bid."
);

return;

}

const roster =
state.rosters[team];

const spent =
roster.reduce(
(sum,player)=>
sum+Number(player.price),
0
);

const remaining =
200-spent;

const spotsLeft =
15-roster.length;

const maxBid =
remaining-(spotsLeft-1);

if(bid>maxBid){

alert(
team+
" can only bid up to $"+
maxBid
);

return;

}

const purchase = {

name:state.active.name,
position:state.active.position,
team:team,
price:bid

};

state.rosters[team].push(
purchase
);

state.history.push(
purchase
);

state.active = {

...purchase,
sold:true

};

document.getElementById(
"winningBid"
).value="";

render();

await saveDraft();

}


/* =========================================================
   UNDO
   ========================================================= */

async function undoLast(){

if(!state.history.length){

return;

}

const last =
state.history.pop();

const roster =
state.rosters[last.team];

const index =
roster.findIndex(player=>{

return (
player.name===last.name &&
Number(player.price)===
Number(last.price)
);

});

if(index>=0){

roster.splice(index,1);

}

state.active=null;

render();

await saveDraft();

}


/* =========================================================
   RESET
   ========================================================= */

async function resetDraft(){

const answer =
confirm(
"RESET THE ENTIRE DRAFT?"
);

if(!answer){

return;

}

state =
emptyState();

render();

await saveDraft();

}


/* =========================================================
   TEAM TABLE
   ========================================================= */

function renderTeams(){

const table =
document.getElementById("teams");

table.innerHTML="";

teams.forEach(team=>{

const roster =
state.rosters[team] || [];

const spent =
roster.reduce(
(sum,player)=>
sum+Number(player.price),
0
);

const remaining =
200-spent;

const spots =
15-roster.length;

const maxBid =
Math.max(
0,
remaining-(spots-1)
);

const row =
document.createElement("tr");

row.innerHTML = `

<td>
<b>${team}</b>
</td>

<td class="money">
$${remaining}
</td>

<td>
${roster.length}/15
</td>

<td class="money">
$${maxBid}
</td>

`;

table.appendChild(row);

});

}


/* =========================================================
   HISTORY TABLE
   ========================================================= */

function renderHistory(){

const table =
document.getElementById("history");

table.innerHTML="";

state.history.forEach(
(player,index)=>{

const row =
document.createElement("tr");

row.innerHTML = `

<td>
${index+1}
</td>

<td>
<b>${player.name}</b>
</td>

<td>
${player.position}
</td>

<td>
${player.team}
</td>

<td class="money">
$${player.price}
</td>

`;

table.appendChild(row);

});

}


/* =========================================================
   ACTIVE PLAYER
   ========================================================= */

function renderActive(){

const name =
document.getElementById(
"playerName"
);

const position =
document.getElementById(
"playerPosition"
);

const sold =
document.getElementById(
"soldMessage"
);

if(!state.active){

name.textContent =
"No Player Nominated";

position.textContent =
"—";

sold.innerHTML =
"";

return;

}

name.textContent =
state.active.name;

position.textContent =
state.active.position;

if(state.active.sold){

sold.innerHTML = `

<div class="sold">

SOLD — ${state.active.team}
— $${state.active.price}

</div>

`;

}else{

sold.innerHTML =
"";

}

}


/* =========================================================
   RENDER
   ========================================================= */

function render(){

renderActive();

renderTeams();

renderHistory();

searchPlayers();

}


/* =========================================================
   BUTTONS
   ========================================================= */

document
.getElementById("search")
.addEventListener(
"input",
searchPlayers
);

document
.getElementById("sellButton")
.addEventListener(
"click",
sellPlayer
);

document
.getElementById("undoButton")
.addEventListener(
"click",
undoLast
);

document
.getElementById("resetButton")
.addEventListener(
"click",
resetDraft
);


/* =========================================================
   START
   ========================================================= */

loadTeams();

render();

loadDraft();

</script>

</body>
</html>
