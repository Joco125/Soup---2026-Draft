<body>

<script>

/* =========================================================
SUPABASE
========================================================= */

const SUPABASE_URL =
"https://hbwszhzcbmlqidkppzoe.supabase.co";

const SUPABASE_KEY =
"sb_publishable_JT3NCra2viuuGm3jJFCF-g_pc_1X3VK";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================================================
COMMISSIONER PIN
========================================================= */

const COMMISSIONER_PIN =
"0125";

let isCommissioner =
false;


/* =========================================================
TEAMS
========================================================= */

const teams = [

"Joco",
"Bij",
"Steguin",
"Mike Gabbay",
"Allie + Ikey",
"Jack + Ike B",
"Ben",
"Dave",
"Jeff",
"Lati"

];


/* =========================================================
PLAYERS
========================================================= */

const players = [

["Josh Allen","BUF","QB"],
["Lamar Jackson","BAL","QB"],
["Jalen Hurts","PHI","QB"],
["Joe Burrow","CIN","QB"],
["Patrick Mahomes II","KC","QB"],

["Bijan Robinson","ATL","RB"],
["Saquon Barkley","PHI","RB"],
["Jahmyr Gibbs","DET","RB"],
["Christian McCaffrey","SF","RB"],
["Jonathan Taylor","IND","RB"],

["CeeDee Lamb","DAL","WR"],
["Ja'Marr Chase","CIN","WR"],
["Justin Jefferson","MIN","WR"],
["Amon-Ra St. Brown","DET","WR"],
["Puka Nacua","LAR","WR"],
["Tyreek Hill","MIA","WR"],
["A.J. Brown","PHI","WR"],
["Malik Nabers","NYG","WR"],
["Garrett Wilson","NYJ","WR"],
["Nico Collins","HOU","WR"],

["Brock Bowers","LV","TE"],
["Trey McBride","ARI","TE"],
["Sam LaPorta","DET","TE"],
["Travis Kelce","KC","TE"],
["George Kittle","SF","TE"],

["Brandon Aubrey","DAL","K"],
["Justin Tucker","BAL","K"],
["Harrison Butker","KC","K"],

["Baltimore Ravens","BAL","DEF"],
["San Francisco 49ers","SF","DEF"],
["Pittsburgh Steelers","PIT","DEF"],
["Kansas City Chiefs","KC","DEF"]

];


/* =========================================================
STATE
========================================================= */

function emptyState(){

const rosters = {};

teams.forEach(team=>{
rosters[team]=[];
});

return {
rosters:rosters,
history:[],
active:null
};

}

let state =
emptyState();


/* =========================================================
NORMALIZE
========================================================= */

function normalizeState(saved){

const clean =
emptyState();

if(saved && saved.rosters){

teams.forEach(team=>{

if(Array.isArray(
saved.rosters[team]
)){

clean.rosters[team] =
saved.rosters[team];

}

});

}

if(saved &&
Array.isArray(saved.history)){

clean.history =
saved.history;

}

if(saved &&
saved.active){

clean.active =
saved.active;

}

return clean;

}


/* =========================================================
LOAD
========================================================= */

async function loadDraft(){

const {data,error} =

await supabaseClient
.from("draft_state")
.select("state")
.eq("draft_code","JCO26")
.limit(1);

if(error){

console.error(
"LOAD ERROR:",
error
);

setConnection(
"DATABASE ERROR",
true
);

return;

}

if(data &&
data.length &&
data[0].state){

state =
normalizeState(
data[0].state
);

}else{

state =
emptyState();

}

setConnection(
"LIVE",
false
);

render();

}


/* =========================================================
SAVE
========================================================= */

async function saveDraft(){

const {error} =

await supabaseClient
.from("draft_state")
.update({

state:state,

updated_at:
new Date().toISOString()

})
.eq("id",1);

if(error){

console.error(
"SAVE ERROR:",
error
);

alert(
"Could not save draft."
);

}

}


/* =========================================================
LIVE UPDATES
========================================================= */

async function checkForUpdates(){

const {data,error} =

await supabaseClient
.from("draft_state")
.select(
"state,updated_at"
)
.eq(
"draft_code",
"JCO26"
)
.limit(1);

if(error){

console.error(
"UPDATE ERROR:",
error
);

setConnection(
"DATABASE ERROR",
true
);

return;

}

setConnection(
"LIVE",
false
);

if(data &&
data.length &&
data[0].state){

state =
normalizeState(
data[0].state
);

render();

}

}

setInterval(
checkForUpdates,
2000
);


/* =========================================================
CONNECTION
========================================================= */

function setConnection(
text,
isError
){

const element =
document.getElementById(
"connection"
);

element.textContent =
text;

element.classList.remove(
"online"
);

element.classList.remove(
"error"
);

if(isError){

element.classList.add(
"error"
);

}else if(text==="LIVE"){

element.classList.add(
"online"
);

}

}


/* =========================================================
OPEN COMMISSIONER MENU
========================================================= */

document
.getElementById(
"commissionerLoginButton"
)
.addEventListener(
"click",
function(){

const menu =
document.getElementById(
"commissioner"
);

if(menu.style.display === "block"){

menu.style.display =
"none";

}else{

menu.style.display =
"block";

document
.getElementById("pinInput")
.focus();

}

}
);


/* =========================================================
LOGIN
========================================================= */

function login(){

const entered =
document.getElementById(
"pinInput"
).value;

if(entered ===
COMMISSIONER_PIN){

isCommissioner =
true;

document.getElementById(
"commissionerControls"
).style.display =
"block";

document.getElementById(
"commissionerBadge"
).style.display =
"inline-block";

document.getElementById(
"loginMessage"
).textContent =
"";

loadTeams();

searchPlayers();

}else{

document.getElementById(
"loginMessage"
).textContent =
"Incorrect PIN.";

}

}


/* =========================================================
LOGOUT
========================================================= */

function logout(){

isCommissioner =
false;

document.getElementById(
"commissionerControls"
).style.display =
"none";

document.getElementById(
"commissionerBadge"
).style.display =
"none";

document.getElementById(
"pinInput"
).value="";

document.getElementById(
"search"
).value="";

document.getElementById(
"playerList"
).innerHTML="";

}


/* =========================================================
TEAMS
========================================================= */

function loadTeams(){

const dropdown =
document.getElementById(
"winningTeam"
);

dropdown.innerHTML="";

teams.forEach(team=>{

const option =
document.createElement(
"option"
);

option.value =
team;

option.textContent =
team;

dropdown.appendChild(
option
);

});

}


/* =========================================================
SEARCH
========================================================= */

function searchPlayers(){

if(!isCommissioner){

return;

}

const query =

document.getElementById(
"search"
).value
.toLowerCase()
.trim();

const list =
document.getElementById(
"playerList"
);

list.innerHTML="";

/* IMPORTANT:
Players do NOT appear until
something is typed.
*/

if(!query){

return;

}

const soldNames =
new Set(
state.history.map(
x=>x.name
)
);

const matches =

players

.filter(player=>

player[0]
.toLowerCase()
.includes(query)

)

.filter(player=>

!soldNames.has(
player[0]
)

);


if(!matches.length){

list.innerHTML =
'<div class="no-results">No players found.</div>';

return;

}


matches.forEach(player=>{

const row =
document.createElement(
"div"
);

row.className =
"player-row";

const info =
document.createElement(
"span"
);

info.innerHTML =

`<b>${player[0]}</b>
<span class="small">
${player[1]} • ${player[2]}
</span>`;

const button =
document.createElement(
"button"
);

button.className =
"gray";

button.textContent =
"Nominate";

button.onclick =
function(){

nominate(
player[0],
player[2]
);

};

row.appendChild(info);

row.appendChild(button);

list.appendChild(row);

});

}


/* =========================================================
NOMINATE
========================================================= */

async function nominate(
name,
position
){

if(!isCommissioner){

return;

}

state.active={

name:name,

position:position,

sold:false

};

render();

await saveDraft();

}


/* =========================================================
SELL
========================================================= */

async function sellPlayer(){

if(!isCommissioner){

return;

}

if(!state.active){

alert(
"Nominate a player first."
);

return;

}

const team =

document.getElementById(
"winningTeam"
).value;

const bid =

Number(
document.getElementById(
"winningBid"
).value
);

if(!bid || bid<1){

alert(
"Enter a winning bid."
);

return;

}

const roster =
state.rosters[team];

const spent =

roster.reduce(
(sum,player)=>
sum+Number(player.price),
0
);

const remaining =
200-spent;

const spotsLeft =
15-roster.length;

const maxBid =
remaining-(spotsLeft-1);

if(bid>maxBid){

alert(
team+
" can only bid up to $"+
maxBid
);

return;

}

const purchase={

name:
state.active.name,

position:
state.active.position,

team:team,

price:bid

};

state.rosters[team]
.push(purchase);

state.history
.push(purchase);

state.active={

...purchase,

sold:true

};

document.getElementById(
"winningBid"
).value="";

render();

await saveDraft();

}


/* =========================================================
UNDO
========================================================= */

async function undoLast(){

if(!isCommissioner){

return;

}

if(!state.history.length){

return;

}

const last =
state.history.pop();

const roster =
state.rosters[last.team];

const index =

roster.findIndex(
player=>

player.name===
last.name &&

Number(player.price)===
Number(last.price)

);

if(index>=0){

roster.splice(
index,
1
);

}

state.active =
null;

render();

await saveDraft();

}


/* =========================================================
RESET
========================================================= */

async function resetDraft(){

if(!isCommissioner){

return;

}

const answer =
confirm(
"RESET THE ENTIRE DRAFT?"
);

if(!answer){

return;

}

state =
emptyState();

render();

await saveDraft();

}


/* =========================================================
TEAM STATUS
========================================================= */

function renderTeams(){

const table =
document.getElementById(
"teams"
);

table.innerHTML="";

teams.forEach(team=>{

const roster =
state.rosters[team] ||
[];

const spent =

roster.reduce(
(sum,player)=>
sum+Number(player.price),
0
);

const remaining =
200-spent;

const spots =
15-roster.length;

const maxBid =

Math.max(
0,
remaining-(spots-1)
);

const row =
document.createElement(
"tr"
);

row.innerHTML = `

<td>
<b>${team}</b>
</td>

<td class="money">
$${remaining}
</td>

<td>
${roster.length}/15
</td>

<td class="money">
$${maxBid}
</td>

`;

table.appendChild(row);

});

}


/* =========================================================
HISTORY
========================================================= */

function renderHistory(){

const table =
document.getElementById(
"history"
);

table.innerHTML="";

state.history.forEach(
(player,index)=>{

const row =
document.createElement(
"tr"
);

row.innerHTML = `

<td>
${index+1}
</td>

<td>
<b>${player.name}</b>
</td>

<td>
${player.position}
</td>

<td>
${player.team}
</td>

<td class="money">
$${player.price}
</td>

`;

table.appendChild(row);

});

}


/* =========================================================
ACTIVE PLAYER
========================================================= */

function renderActive(){

const name =
document.getElementById(
"playerName"
);

const position =
document.getElementById(
"playerPosition"
);

const sold =
document.getElementById(
"soldMessage"
);

if(!state.active){

name.textContent =
"No Player Nominated";

position.textContent =
"—";

sold.innerHTML =
"";

return;

}

name.textContent =
state.active.name;

position.textContent =
state.active.position;

if(state.active.sold){

sold.innerHTML = `

<div class="sold">

SOLD — ${state.active.team}
— $${state.active.price}

</div>

`;

}else{

sold.innerHTML="";

}

}


/* =========================================================
RENDER
========================================================= */

function render(){

renderActive();

renderTeams();

renderHistory();

if(isCommissioner){

searchPlayers();

}

}


/* =========================================================
BUTTONS
========================================================= */

document
.getElementById("loginButton")
.addEventListener(
"click",
login
);

document
.getElementById("pinInput")
.addEventListener(
"keydown",
function(event){

if(event.key==="Enter"){

login();

}

});

document
.getElementById("logoutButton")
.addEventListener(
"click",
logout
);

document
.getElementById("search")
.addEventListener(
"input",
searchPlayers
);

document
.getElementById("sellButton")
.addEventListener(
"click",
sellPlayer
);

document
.getElementById("undoButton")
.addEventListener(
"click",
undoLast
);

document
.getElementById("resetButton")
.addEventListener(
"click",
resetDraft
);


/* =========================================================
START
========================================================= */

loadTeams();

render();

loadDraft();

</script>

</body>
</html>
