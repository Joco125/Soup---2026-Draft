<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Soup 2026 - Team Results</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box
}

html,body{
margin:0;
width:100%;
min-height:100%;
background:#0b1020;
color:#fff;
font-family:Arial,sans-serif
}

header{
padding:15px 30px;
background:#11182b;
border-bottom:1px solid #293553;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:10px
}

h1{
margin:0;
font-size:25px
}

.small{
color:#9da9c0;
font-size:12px
}

.status{
padding:8px 12px;
border-radius:20px;
background:#26324d;
color:#9da9c0;
font-size:13px
}

.online{
color:#32c875
}

.error{
color:#ef5350
}

a.button,
button{
border:0;
border-radius:8px;
padding:10px 15px;
font-weight:bold;
cursor:pointer;
text-decoration:none;
display:inline-block
}

.blue{
background:#4f8cff;
color:white
}

.container{
max-width:1700px;
margin:auto;
padding:20px
}

.teams-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
gap:18px
}

.team-card{
background:#11182b;
border:1px solid #293553;
border-radius:14px;
padding:16px;
display:flex;
flex-direction:column
}

.team-card-header{
display:flex;
justify-content:space-between;
align-items:baseline;
margin-bottom:10px
}

.team-name{
font-size:19px;
font-weight:bold
}

.team-budget{
font-size:13px;
color:#9da9c0;
text-align:right
}

.team-budget b{
color:#32c875
}

table{
width:100%;
border-collapse:collapse
}

th,td{
padding:8px 6px;
text-align:left;
border-bottom:1px solid #293553;
font-size:14px
}

th{
color:#9da9c0;
font-size:11px;
letter-spacing:.5px
}


/* =========================================================
   POSITION COLORS
   ========================================================= */

.slot-label{
font-weight:bold;
font-size:12px;
width:70px
}

.slot-qb{
color:#ff6b6b
}

.slot-wr{
color:#4f8cff
}

.slot-rb{
color:#32c875
}

.slot-te{
color:#b56cff
}

.slot-flex{
color:#f5a623
}

.slot-k{
color:#00d4aa
}

.slot-d{
color:#ff4fd8
}

.slot-bench{
color:#697792
}

.player-name{
font-weight:bold
}

.empty-slot{
color:#4a5578;
font-style:italic
}

.price{
text-align:right;
font-weight:bold;
color:#32c875
}


/* =========================================================
   MOBILE TEAM SELECTOR
   ========================================================= */

.mobile-team-selector{
display:none
}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:600px){

header{
padding:12px 14px;
gap:10px
}

header h1{
font-size:19px
}

header .small{
font-size:10px;
margin-top:3px
}

header > div:last-child{
width:100%;
display:grid !important;
grid-template-columns:1fr 1fr;
gap:7px !important
}

header > div:last-child .status{
grid-column:1 / -1;
text-align:center;
padding:6px 10px;
font-size:11px
}

header > div:last-child a{
width:100%;
text-align:center;
padding:9px 8px;
font-size:12px
}

.container{
padding:12px
}

.mobile-team-selector{
display:block;
margin-bottom:15px
}

.mobile-team-selector select{
width:100%;
background:#11182b;
color:#fff;
border:1px solid #293553;
border-radius:10px;
padding:14px;
font-size:16px;
font-weight:bold
}

.teams-grid{
display:block
}

.team-card{
display:none
}

.team-card.mobile-selected{
display:flex
}

}


/* =========================================================
   DESKTOP
   ========================================================= */

@media(min-width:601px){

.team-card{
display:flex
}

}

</style>
</head>


<body>


<header>

<div>

<h1>🏈 Team Results</h1>

<div class="small">
Soup 2026 Fantasy Auction Draft
</div>

</div>

<div style="display:flex;align-items:center;gap:10px">

<a
href="index.html"
class="button blue"
>
Back to Draft
</a>

<span id="connection" class="status">
Connecting...
</span>

</div>

</header>


<div class="container">


<!-- MOBILE TEAM SELECTOR -->

<div class="mobile-team-selector">

<select id="mobileTeamSelect"></select>

</div>


<div id="teamsGrid" class="teams-grid"></div>


</div>


<script>


/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
"https://hbwszhzcbmlqidkppzoe.supabase.co";

const SUPABASE_KEY =
"sb_publishable_JT3NCra2viuuGm3jJFCF-g_pc_1X3VK";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================================================
   TEAMS
   ========================================================= */

const teams = [

"Joco",
"Bij",
"Steguin",
"Mike Gabbay",
"Allie + Ikey",
"Jack + Ike B",
"Ben",
"Dave",
"Jeff",
"Lati"

];


/* =========================================================
   ROSTER SLOTS
   ========================================================= */

const SLOT_DEFS = [

{label:"QB",accepts:["QB"],className:"slot-qb"},
{label:"QB",accepts:["QB"],className:"slot-qb"},

{label:"WR",accepts:["WR"],className:"slot-wr"},
{label:"WR",accepts:["WR"],className:"slot-wr"},

{label:"RB",accepts:["RB"],className:"slot-rb"},
{label:"RB",accepts:["RB"],className:"slot-rb"},

{label:"TE",accepts:["TE"],className:"slot-te"},

{label:"FLEX",accepts:["RB","WR","TE"],className:"slot-flex"},
{label:"FLEX",accepts:["RB","WR","TE"],className:"slot-flex"},

{label:"K",accepts:["K"],className:"slot-k"},

{label:"D",accepts:["DST"],className:"slot-d"},

{label:"BENCH",accepts:["QB","RB","WR","TE","K","DST"],className:"slot-bench"},
{label:"BENCH",accepts:["QB","RB","WR","TE","K","DST"],className:"slot-bench"},
{label:"BENCH",accepts:["QB","RB","WR","TE","K","DST"],className:"slot-bench"},
{label:"BENCH",accepts:["QB","RB","WR","TE","K","DST"],className:"slot-bench"},
{label:"BENCH",accepts:["QB","RB","WR","TE","K","DST"],className:"slot-bench"}

];


/* =========================================================
   STATE
   ========================================================= */

let state={

rosters:{},
history:[],
active:null

};


function normalizeState(saved){

const clean={

rosters:{},
history:[],
active:null

};

teams.forEach(team=>{

clean.rosters[team]=[];

});


if(saved && saved.rosters){

teams.forEach(team=>{

if(Array.isArray(saved.rosters[team])){

clean.rosters[team]=
saved.rosters[team];

}

});

}


if(saved && Array.isArray(saved.history)){

clean.history=
saved.history;

}


if(saved && saved.active){

clean.active=
saved.active;

}


return clean;

}


/* =========================================================
   ASSIGN ROSTER TO SLOTS
   ========================================================= */

function assignRosterToSlots(roster){

const slots=

SLOT_DEFS.map(def=>({

label:def.label,
accepts:def.accepts,
className:def.className,
player:null

}));


/* EXACT POSITION SLOTS */

roster.forEach(player=>{

const slot=
slots.find(s=>

!s.player &&

s.label!=="FLEX" &&

s.label!=="BENCH" &&

s.accepts.includes(
player.position
)

);

if(slot){

slot.player=player;

}

});


/* FLEX */

roster.forEach(player=>{

const alreadyPlaced=

slots.some(s=>

s.player &&

s.player.name===
player.name &&

Number(s.player.price)===
Number(player.price)

);

if(alreadyPlaced){

return;

}

const slot=
slots.find(s=>

!s.player &&

s.label==="FLEX" &&

s.accepts.includes(
player.position
)

);

if(slot){

slot.player=player;

}

});


/* BENCH */

roster.forEach(player=>{

const alreadyPlaced=

slots.some(s=>

s.player &&

s.player.name===
player.name &&

Number(s.player.price)===
Number(player.price)

);

if(alreadyPlaced){

return;

}

const slot=
slots.find(s=>

!s.player &&

s.label==="BENCH"

);

if(slot){

slot.player=player;

}

});


return slots;

}


/* =========================================================
   CONNECTION
   ========================================================= */

function setConnection(text,isError){

const element=
document.getElementById(
"connection"
);

element.textContent=text;

element.classList.remove("online");
element.classList.remove("error");

if(isError){

element.classList.add("error");

}else if(text==="LIVE"){

element.classList.add("online");

}

}


/* =========================================================
   MOBILE TEAM SELECTOR
   ========================================================= */

function setupMobileTeamSelector(){

const selector=
document.getElementById(
"mobileTeamSelect"
);

if(!selector){

return;

}

selector.innerHTML="";

teams.forEach((team,index)=>{

const option=
document.createElement(
"option"
);

option.value=team;
option.textContent=team;

if(index===0){

option.selected=true;

}

selector.appendChild(option);

});


selector.onchange=function(){

document
.querySelectorAll(".team-card")
.forEach(card=>{

card.classList.remove(
"mobile-selected"
);

});


const selected=
document.querySelector(
`.team-card[data-team="${CSS.escape(this.value)}"]`
);

if(selected){

selected.classList.add(
"mobile-selected"
);

}

};

}


/* =========================================================
   RENDER
   ========================================================= */

function render(){

const grid=
document.getElementById(
"teamsGrid"
);

grid.innerHTML="";


teams.forEach(team=>{

const roster=
state.rosters[team]||
[];

const spent=
roster.reduce(
(sum,player)=>
sum+Number(player.price),
0
);

const remaining=
200-spent;

const slots=
assignRosterToSlots(roster);


const card=
document.createElement(
"div"
);

card.className=
"team-card";

card.dataset.team=
team;


/* TEAM HEADER */

const teamHeader=
document.createElement(
"div"
);

teamHeader.className=
"team-card-header";

teamHeader.innerHTML=`

<div class="team-name">
${team}
</div>

<div class="team-budget">

Spent <b>$${spent}</b><br>

$${remaining} left

</div>

`;

card.appendChild(
teamHeader
);


/* TABLE */

const table=
document.createElement(
"table"
);

const tbody=
document.createElement(
"tbody"
);


slots.forEach(slot=>{

const row=
document.createElement(
"tr"
);


if(slot.player){

row.innerHTML=`

<td class="slot-label ${slot.className}">
${slot.label}
</td>

<td>

<div class="player-name">
${slot.player.name}
</div>

</td>

<td class="price">
$${slot.player.price}
</td>

`;

}else{

row.innerHTML=`

<td class="slot-label ${slot.className}">
${slot.label}
</td>

<td class="empty-slot">
Empty
</td>

<td></td>

`;

}

tbody.appendChild(row);

});


table.appendChild(tbody);

card.appendChild(table);

grid.appendChild(card);

});


/*
Re-apply selected mobile team
after every render.
*/

const selector=
document.getElementById(
"mobileTeamSelect"
);

if(selector){

const selectedTeam=
selector.value ||
teams[0];

selector.innerHTML="";

teams.forEach(team=>{

const option=
document.createElement(
"option"
);

option.value=team;
option.textContent=team;

if(team===selectedTeam){

option.selected=true;

}

selector.appendChild(option);

});


document
.querySelectorAll(".team-card")
.forEach(card=>{

card.classList.remove(
"mobile-selected"
);

});


const selectedCard=
document.querySelector(
`.team-card[data-team="${CSS.escape(selectedTeam)}"]`
);

if(selectedCard){

selectedCard.classList.add(
"mobile-selected"
);

}

}

}


/* =========================================================
   LOAD STATE
   ========================================================= */

async function loadState(){

const{data,error}=

await supabaseClient
.from("draft_state")
.select("state")
.eq("draft_code","JCO26")
.limit(1);


if(error){

console.error(
"LOAD ERROR:",
error
);

setConnection(
"DATABASE ERROR",
true
);

return;

}


if(
data &&
data.length &&
data[0].state
){

state=
normalizeState(
data[0].state
);

}


setConnection(
"LIVE",
false
);

render();

}


/* =========================================================
   START
   ========================================================= */

setupMobileTeamSelector();

render();

loadState();


/* =========================================================
   LIVE UPDATES
   ========================================================= */

setInterval(
loadState,
2000
);

</script>

</body>
</html>
